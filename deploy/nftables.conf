#!/usr/sbin/nft -f
# Firewall do HOST de produção (Etapa 6, B3) — MODELO, aplique com sudo:
#   sudo nft -f deploy/nftables.conf
# NÃO é executado por este projeto. Revise antes de aplicar: um erro pode
# trancar o seu acesso SSH.
#
# Política: entrada negada por padrão; só 80/tcp e 443/tcp abertos ao mundo
# (o proxy Caddy), e SSH (22/tcp) RESTRITO à sua rede de administração.
# Ajuste SSH_ADMIN_CIDR para o seu IP/sub-rede antes de aplicar.
#
# define SSH_ADMIN_CIDR = 203.0.113.0/24   # <-- troque pelo SEU bloco
flush ruleset

table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;

    iif "lo" accept
    ct state established,related accept
    ct state invalid drop

    # Descoberta de MTU / diagnóstico mínimo (ICMP), sem abrir tudo.
    ip protocol icmp icmp type { echo-request } limit rate 5/second accept
    ip6 nexthdr icmpv6 accept

    # SSH só da rede de administração (troque o CIDR; NÃO deixe 0.0.0.0/0).
    # ip saddr $SSH_ADMIN_CIDR tcp dport 22 accept

    # Serviço público: só o proxy.
    tcp dport { 80, 443 } accept

    # Tudo o mais (incl. 8000 do backend e 5432 do Postgres) é NEGADO.
    # Esses serviços não devem nem escutar no host (ver docker-compose.yml),
    # mas o firewall é a segunda barreira.
  }
  chain forward { type filter hook forward priority 0; policy drop; }
  chain output  { type filter hook output  priority 0; policy accept; }
}
