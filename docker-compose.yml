# Rode com: docker compose --env-file backend/.env up --build
# O --env-file faz o compose ler DB_USER/DB_PASSWORD/DB_NAME do MESMO
# arquivo que o backend usa (sem ele, o compose procuraria um .env na raiz
# e o banco nasceria com uma senha diferente da do backend).
#
# Topologia (Etapa 4a, docs/04-tls-e-proxy.md): o ÚNICO serviço publicado
# no host é o proxy (Caddy, 80 e 443 em 127.0.0.1), que termina o TLS.
# Backend e banco ficam só na rede "interna" (sem portas no host e sem
# saída para a internet); o proxy é o único caminho até o backend.

# Logs (Etapa 5, A4; inventário em docs/06-privacidade.md): json-file com
# rotação em TODOS os serviços — até 3 arquivos de 1 MB por contêiner, e o
# mais antigo é apagado. Sem isso o Docker guarda o log inteiro para sempre.
x-logging: &logging
  driver: json-file
  options:
    max-size: "1m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    # Postgres sem registrar comandos, conexões (com o IP de quem conecta)
    # nem desconexões; erros em modo "terse" (sem DETAIL: a violação de
    # unicidade do e-mail, por exemplo, traria o e-mail) e sem o texto do
    # comando que falhou. São os padrões do Postgres para os três primeiros;
    # aqui ficam explícitos para uma imagem ou config futura não mudá-los.
    command:
      - postgres
      - -c
      - log_statement=none
      - -c
      - log_connections=off
      - -c
      - log_disconnections=off
      - -c
      - log_min_error_statement=panic
      - -c
      - log_error_verbosity=terse
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      # Sem valor padrão: faltando, o compose falha em vez de criar o banco
      # com uma senha pública.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD (use --env-file backend/.env)}
      POSTGRES_DB: ${DB_NAME:-secure_chat}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/database/migrations.sql:/docker-entrypoint-initdb.d/01-migrations.sql:ro
    networks:
      - interna
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    logging: *logging
    env_file:
      - ./backend/.env
    # Sobrescrevem o backend/.env (que serve também para rodar fora do Docker).
    environment:
      DB_HOST: db
      SERVER_PORT: "8000" # o Caddyfile encaminha para backend:8000
      NODE_ENV: production # cookie de sessão com Secure
      TRUST_PROXY: "1" # exatamente um proxy (o Caddy) na frente
      # A origem pública única: CORS e checagem de Origin do upgrade do /ws.
      CLIENT_URL: https://${PUBLIC_HOST:-localhost}
    networks:
      - interna
    depends_on:
      db:
        condition: service_healthy

  # Build do frontend (Etapa 5, B5): multi-estágio com npm ci; ao subir,
  # publica o dist num volume e sai. O proxy monta esse volume SOMENTE
  # LEITURA. Sem rede e sem privilégios: só copia arquivos.
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: "no"
    logging: *logging
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - frontend_dist:/out

  proxy:
    # Versão fixada por tag E digest (a tag sozinha pode ser republicada).
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    restart: unless-stopped
    logging: *logging
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - frontend_dist:/srv:ro
      # CA local, certificados e chaves privadas do Caddy: em volume, nunca
      # no repositório (scripts/export-ca.sh exporta só o certificado raiz).
      - caddy_data:/data
      - caddy_config:/config
    # Só o necessário para escutar em 80/443 dentro do container.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      - borda
      - interna
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_completed_successfully

networks:
  # internal: true → sem rota para fora; nada nesta rede é publicável no host.
  interna:
    internal: true
  borda: {}

volumes:
  db_data:
  frontend_dist:
  caddy_data:
  caddy_config:
